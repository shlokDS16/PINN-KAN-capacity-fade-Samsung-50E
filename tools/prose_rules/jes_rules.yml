# Journal rules for tools/prose_check.py (Journal of Energy Storage, Elsevier).
# Regexes are Python `re`, written in single-quoted YAML strings (backslashes are literal;
# write an apostrophe as \x27). Matching is case-insensitive unless `case: true`.
# `skip_if` is a regex tested on the whole sentence; when it matches, the flag is dropped.
# Sources for the AI-tell lists: the research-humanizer skill (references/ai-patterns-academic.md,
# section B and the patterns in section A/C/D) plus the words named in the task brief.
version: 1

# Files in the draft folder that are working notes, not manuscript text. They get the full
# checks but are left out of the abbreviation/consistency pass and of the "top 20" list.
non_manuscript_files:
  - '00_open_items.md'
  - 'CITATION_AUDIT.md'
  - 'WRITER_*'
  - 'refs_*'
  - 'PROSE_CHECK_REPORT.md'

limits:
  sentence_max_words: 40
  sentence_very_long_words: 60
  paragraph_max_words: 200
  ai_cluster_threshold: 3        # AI-tell hits in one paragraph that make a cluster flag
  uniform_cadence_min_sentences: 6
  uniform_cadence_cv: 0.28       # coefficient of variation of sentence length below which cadence is flat

languagetool:
  language: en-GB                # the draft uses -ise / -isation (normalised, generalisation)
  picky: true
  disabled_rules:
    - EN_QUOTES                  # curly-vs-straight quotes are checked by the typography rule
    - TYPOGRAPHICAL_QUOTES
    - SMART_QUOTES
    - SERIAL_COMMA_ON            # the draft consistently omits the Oxford comma (British usage)
    - REP_PASSIVE_VOICE          # passive voice is normal in Methods; no passive-voice ban
    - OXFORD_SPELLING_Z_NOT_S    # the draft uses -ise (normalised, generalisation), not Oxford -ize
  disabled_categories: []
  # rule ids whose matches are dropped after the run (misfires on scientific prose); extend as needed
  ignore_rules:
    - PEE_INSTALLED              # offers "pre-seed" for the term "per-seed"
  # rule id -> regex; a match is dropped when the flagged text matches the regex
  ignore_rule_text:
    MULTIPLICATION_SIGN: '\*'    # arm label D*
    THE_SUPERLATIVE: '^least$'   # "least squares"
    POSSESSIVE_APOSTROPHE: '^beats$'   # verb: "A1 beats persistence"
  # spelling flags for tokens shaped like identifiers are dropped (A15, LightGBM, k_full, ...)
  ignore_spelling_identifiers: true

# Vale matches dropped after the run, as check name -> regex on the matched text (case-insensitive).
# write-good.TooWordy lists ordinary scientific verbs (evaluate, implement, maximum, therefore, ...);
# only multi-word phrases and genuinely pompous single words are kept.
vale_ignore_text:
  write-good.TooWordy: '^(?!(?:accomplish|aforementioned|ascertain|commence|endeavou?r|facilitate|utili[sz]e|terminate|initiate|expedite|subsequent|ameliorate|elucidate)$)(?:\w+|it is|it was|it seems that)$'
  proselint.Typography: '^\(c\)$'            # "(c)" is a list label (Set (c)), not a copyright sign

# ---------------------------------------------------------------------------------------
# Word and phrase rules.  category / severity / message / suggestion are shown in the report.
word_rules:
  - id: ai-vocab-core
    category: AI-sounding phrasing
    severity: medium
    words: ['delv(?:e|es|ed|ing)', 'tapestry', 'realms?', 'myriad', 'plethora', 'multifaceted',
            'intricate(?:ly)?', 'intricacies', 'burgeoning', 'meticulous(?:ly)?', 'commendabl[ey]',
            'paramount', 'testament', 'pivotal', 'showcas(?:e|es|ed|ing)', 'underscor(?:e|es|ed|ing)',
            'leverag(?:e|es|ed|ing)', 'seamless(?:ly)?', 'elucidat(?:e|es|ed|ing)',
            'harness(?:es|ed|ing)?', 'foster(?:s|ed|ing)?', 'bolster(?:s|ed|ing)?']
    message: "'{m}' is a high-frequency word in machine-written text."
    suggestion: "Use the plain verb or noun (use, show, support, range, central), or state the concrete point."
  - id: ai-vocab-weak
    category: AI-sounding phrasing
    severity: low
    words: ['crucial(?:ly)?', 'vital(?:ly)?', 'notabl[ey]', 'noteworthy', 'landscape', 'paradigm',
            'holistic(?:ally)?', 'comprehensive(?:ly)?', 'interplay', 'groundbreaking',
            'cutting-edge', 'facilitat(?:e|es|ed|ing)', 'utili[sz](?:e|es|ed|ing|ation)',
            'multi-faceted', 'nuanced']
    message: "'{m}' reads as filler; one is fine, a cluster is a machine-writing signature."
    suggestion: "Replace with the specific property (for example 'large', 'complete', 'important because ...') or delete."
  - id: ai-robust
    category: AI-sounding phrasing
    severity: low
    words: ['robust(?:ly|ness)?']
    skip_if: 'robust (?:regression|standard error|estimat|statistic|loss|scal|PCA|covariance|fit)|outlier|heteroscedast|Huber|median'
    message: "'robust' without a defined meaning is a stock word."
    suggestion: "Say what it withstands (noise, outliers, held-out conditions) and how you measured it, or drop it."
  - id: weak-intensifier
    category: Weak or hedged wording
    severity: low
    words: ['very', 'really', 'quite', 'extremely', 'fairly', 'somewhat']
    message: "'{m}' adds no information."
    suggestion: "Delete it, or give the number."
  - id: booster
    category: Weak or hedged wording
    severity: low
    words: ['clearly', 'obviously', 'undoubtedly', 'evidently', 'certainly', 'needless to say', 'of course',
            'it is evident that', 'it is clear that']
    message: "Booster '{m}' asserts certainty instead of showing evidence."
    suggestion: "Delete it and let the result or citation carry the claim."
  - id: contraction
    category: Style
    severity: low
    words: ['\b(?:it|that|there|here|what|who|he|she|we|they|you|I)[\x27’](?:s|re|ve|ll|d|m)', '\w+n[\x27’]t']
    message: "Contraction '{m}' in formal journal prose."
    suggestion: "Write the words in full."
  - id: wordy-phrase
    category: Wordiness
    severity: medium
    words: ['in order to', 'due to the fact that', 'owing to the fact that', 'in spite of the fact that',
            'a number of', 'a large number of', 'a majority of', 'the majority of', 'has the ability to',
            'have the ability to', 'is able to', 'are able to', 'is capable of', 'in the case of',
            'in the event that', 'for the purpose of', 'with regard to', 'with respect to', 'at the present time',
            'at this point in time', 'prior to', 'subsequent to', 'on the basis of', 'in addition to this',
            'whether or not', 'serves to', 'in light of the fact that', 'it is worth mentioning that']
    message: "Wordy: '{m}'."
    suggestion: "Shorter forms: to, because, several / many, can, for, about, if, before, after, from, whether."
  - id: redundant-pair
    category: Wordiness
    severity: medium
    words: ['each and every', 'first and foremost', 'various different', 'future plans', 'final outcome',
            'completely eliminat\w+', 'may possibly', 'basic fundamentals', 'close proximity', 'end result',
            'past history', 'absolutely essential', 'totally unique', 'advance planning']
    message: "Redundant pair '{m}'."
    suggestion: "Keep one word."
  - id: stacked-hedge
    category: Weak or hedged wording
    severity: medium
    words: ['(?:may|might|could|can)\s+(?:possibly|potentially|perhaps|conceivably)',
            '(?:possibly|potentially|perhaps)\s+(?:may|might|could)',
            'seems?\s+to\s+(?:possibly|potentially|suggest|indicate|imply)',
            '(?:appears?|seems?)\s+to\s+(?:be\s+)?(?:somewhat|rather|relatively)']
    message: "Stacked hedge '{m}': two softeners on one claim."
    suggestion: "Pick one hedge that matches the strength of the evidence."
  - id: field-importance-opener
    category: AI-sounding phrasing
    severity: medium
    words: ['in recent years', 'with the rapid (?:development|growth|advancement|expansion)',
            'has attracted (?:increasing|growing|considerable|significant|great) attention',
            'has received (?:increasing|growing|considerable|significant) attention',
            'in today\x27s (?:world|era|society)', 'in the era of']
    message: "Field-importance opener '{m}'."
    suggestion: "Open with the specific quantity, practice or conflict the paper addresses."
  - id: significance-inflation
    category: AI-sounding phrasing
    severity: medium
    words: ['paves? the way', 'shed(?:s|ding)? light on', 'opens? (?:up )?(?:new )?(?:avenues|doors|possibilities)',
            'highlights? the (?:importance|need|significance) of', 'underscores? the (?:importance|need|significance) of',
            'a significant step (?:toward|towards|forward)', 'plays? an? (?:crucial|pivotal|key|vital|important|significant|critical) role',
            'it is (?:worth|important) (?:noting|to note) that', 'it should be noted that',
            'it is worth mentioning', 'a wide range of', 'a wide variety of', 'in the realm of']
    message: "Stock phrase '{m}'."
    suggestion: "State the consequence concretely, or cut the sentence."
  - id: copula-avoidance
    category: AI-sounding phrasing
    severity: low
    words: ['serves as', 'stands as', 'acts as a', 'represents a', 'constitutes a']
    message: "'{m}' where 'is' is true."
    suggestion: "Use 'is' (or the plain verb)."
  - id: negative-parallelism
    category: AI-sounding phrasing
    severity: low
    words: ['not only\b[^.?!]{0,140}\bbut also', 'not merely\b[^.?!]{0,100}\bbut', 'rather than simply']
    message: "Negative parallelism ('{m}')."
    suggestion: "State the positive claim directly."
  - id: vague-attribution
    category: AI-sounding phrasing
    severity: medium
    words: ['studies have (?:shown|demonstrated|found|indicated)', 'researchers have (?:shown|found|increasingly)',
            'it is (?:widely|well|generally) (?:known|recogni[sz]ed|accepted|established)',
            'recent (?:studies|literature|work|research) (?:suggests?|shows?|indicates?|has shown)',
            'many (?:studies|researchers|authors) (?:have )?(?:shown|reported|suggested|argued)',
            'previous (?:studies|work|research) has shown']
    skip_if: '\[1\]'
    message: "Vague attribution '{m}' with no citation next to it."
    suggestion: "Cite the specific study next to the specific fact, or remove the claim."
  - id: filler-transition
    category: AI-sounding phrasing
    severity: low
    words: ['put simply', 'in short,', 'in essence', 'the upshot is', 'at the end of the day', 'in a nutshell',
            'it goes without saying', 'to put it differently']
    message: "Filler transition '{m}'."
    suggestion: "Delete it."
  - id: generic-novelty
    category: Claim needs evidence
    severity: medium
    words: ['novel\s+(?:framework|approach|method|architecture|model|paradigm)', 'comprehensive\s+(?:analysis|evaluation|study|review)',
            'extensive\s+experiments?', 'state-of-the-art\s+(?:performance|results|methods|approaches)']
    message: "Generic claim '{m}'."
    suggestion: "Say what is different, from which named prior work, and by how much."
  - id: claim-novel
    category: Claim needs evidence
    severity: medium
    words: ['novel(?:ty)?']
    message: "'{m}' is a claim, not a result."
    suggestion: "Name what differs from which prior work; keep 'novel' only where a search supports it."
  - id: claim-first
    category: Claim needs evidence
    severity: high
    words: ['to the best of our knowledge', 'for the first time', 'the first (?:study|paper|work|attempt|time|framework|demonstration|application|to)',
            'first-ever', 'unprecedented', 'never (?:before )?(?:been )?(?:reported|done|attempted)']
    message: "Priority claim '{m}' needs a documented prior-art check."
    suggestion: "Cite the search you did, narrow the claim to what is verified, or remove it."
  - id: claim-significant
    category: Claim needs evidence
    severity: medium
    words: ['significant(?:ly)?']
    skip_if: 'p\s*[<=>≤]|statistic|\btests?\b|confidence|interval|CI\b|Wilcoxon|permutation|bootstrap|sign test|t-test|alpha|α|\bSE\b|significance level'
    message: "'{m}' without a test in the sentence."
    suggestion: "Use 'statistically significant' with the test and p value, or a plain word (large, clear, substantial) with a number."
  - id: claim-outperform
    category: Claim needs evidence
    severity: high
    words: ['outperform(?:s|ed|ing)?', 'surpass(?:es|ed|ing)?', 'superior(?:ity)?(?: to)?', 'better than', 'beats?']
    skip_if: '\d|\bX\b'
    message: "'{m}' without a number in the sentence."
    suggestion: "Give the metric, the value, the baseline and the uncertainty."
  - id: claim-magnitude
    category: Claim needs evidence
    severity: low
    words: ['substantial(?:ly)?', 'dramatic(?:ally)?', 'considerabl[ey]', 'remarkabl[ey]', 'markedly', 'vastly', 'greatly',
            'major improvement', 'large improvement', 'significant improvement']
    skip_if: '\d|\bX\b'
    message: "Magnitude word '{m}' with no number."
    suggestion: "Replace with the measured size of the effect."
  - id: claim-sota
    category: Claim needs evidence
    severity: low
    words: ['state-of-the-art']
    skip_if: '\[1\]|\d'
    message: "'state-of-the-art' with no citation or number."
    suggestion: "Name the method and cite it, or write 'the best baseline (name, reference)'."
  - id: claim-prove
    category: Claim needs evidence
    severity: low
    words: ['prov(?:e|es|ed|ing) that', 'proves?n?']
    skip_if: 'theorem|lemma|proposition|identity|analytic|algebra|derivation'
    message: "'{m}' is too strong for an empirical result."
    suggestion: "Use 'shows' or 'is consistent with'."
  - id: trailing-participle
    category: AI-sounding phrasing
    severity: low
    words: [',\s+(?:thereby|thus|hence|thereby also)\s+\w+ing\b',
            ',\s+(?:highlighting|demonstrating|indicating|ensuring|enabling|underscoring|showcasing|reinforcing|facilitating|reflecting)\b']
    message: "Trailing participle clause ('{m}')."
    suggestion: "If it carries a real inference, give it its own sentence with a subject; otherwise delete."

# Sentence-opening rules (tested at the start of a sentence only).
opener_rules:
  - id: empty-opener-there
    category: Clarity
    severity: low
    pattern: 'There\s+(?:is|are|was|were)\b'
    message: "Empty opener 'There {v} ...'."
    suggestion: "Recast with the real subject."
  - id: empty-opener-it
    category: Clarity
    severity: low
    pattern: 'It\s+(?:is|was)\s+\w+\s+that\b'
    message: "Empty opener 'It is ... that'."
    suggestion: "Recast with the real subject."
  - id: connective-additive
    category: AI-sounding phrasing
    severity: low
    pattern: '(?:Moreover|Furthermore|Additionally|In addition|Notably|Importantly|Besides)\b'
    message: "Additive connective '{m}' opening a sentence."
    suggestion: "Keep only connectives that mark a real logical relation."
    cluster_min: 2               # flagged only when this many such openers sit in one paragraph

# Numbers and units.
unit_rules:
  - id: temp-bare-C
    pattern: '(?<![\w.\-])(\d{2,3}(?:\.\d+)?)\s?C(?![\w\-])'
    message: "Temperature unit written as '{m}'."
    suggestion: "Write '{n} °C' (number, space, degree sign, C)."
    severity: medium
  - id: unit-no-space
    pattern: '(?<![\w.\-])(\d+(?:\.\d+)?)(K|V|mV|A|mA|Ah|mAh|Wh|kWh|W|kW|GB|MB|Hz|kHz|MHz|ms|min|nm|µm|mm|cm|kg|°C)(?![\w])'
    case: true
    message: "No space between value and unit in '{m}'."
    suggestion: "Insert a space: '{n} {u}'."
    severity: medium
  - id: quantity-without-unit
    pattern: '\b(?:temperature|voltage|current|capacity|resistance|energy|power|cut-?off|duration|C-rate|charge rate|discharge rate)\s+(?:of|at|=|is|was|from|to)\s+(\d+(?:\.\d+)?)(?!\s*(?:%|°|/|(?:K|V|mV|A|mA|Ah|mAh|Wh|kWh|W|kW|Ω|mΩ|ohms?|s|ms|min|h|d|days?|hours?|minutes?|seconds?|Hz|kHz|F|mm|cm|m|kg|g|C)\b))'
    message: "Physical quantity '{m}' has no unit."
    suggestion: "Add the unit (V, A, Ah, °C, h, ...)."
    severity: medium
  - id: percent-spacing
    pattern: '(?<![\w.])\d+(?:\.\d+)?%'
    message: "Percent written without a space ('{m}'); this draft writes '10 %'."
    suggestion: "Use one style throughout. Elsevier accepts both; consistency is what counts."
    severity: low
    consistency_with: '(?<![\w.])\d+(?:\.\d+)?\s%'

# Consistency: closed list of UK/US pairs (UK form, US form). Mixed use inside one document set is flagged.
spelling_pairs:
  - ['normalis', 'normaliz']
  - ['optimis', 'optimiz']
  - ['generalis', 'generaliz']
  - ['parametris', 'parameteriz']
  - ['parameteris', 'parameteriz']
  - ['standardis', 'standardiz']
  - ['regularis', 'regulariz']
  - ['initialis', 'initializ']
  - ['minimis', 'minimiz']
  - ['maximis', 'maximiz']
  - ['visualis', 'visualiz']
  - ['summaris', 'summariz']
  - ['characteris', 'characteriz']
  - ['categoris', 'categoriz']
  - ['analys(?:e|ed|es|ing)\b', 'analyz(?:e|ed|es|ing)\b']
  - ['modell(?:ing|ed)\b', 'model(?:ing|ed)\b']
  - ['labell(?:ing|ed)\b', 'label(?:ing|ed)\b']
  - ['behaviour', 'behavior']
  - ['colour', 'color']
  - ['centre', 'center']
  - ['neighbour', 'neighbor']
  - ['programme', 'program\b']

# Words that are abbreviations or acronyms but need no expansion at first use.
known_abbreviations:
  - 'USA'
  - 'UK'
  - 'EU'
  - 'DC'
  - 'AC'
  - 'ID'
  - 'PDF'
  - 'CPU'
  - 'GPU'
  - 'RAM'
  - 'SI'
  - 'DOI'
  - 'URL'
  - 'OK'
  - 'CSV'
  - 'JSON'
  - 'II'
  - 'III'
  - 'IV'
  - 'VI'
  - 'IEEE'
  - 'NASA'
  - 'CO2'
  - 'CUDA'
  - 'Li'
  - 'NMC'
  - 'LFP'

# Capitalised tokens that look like abbreviations but are labels or names in this paper.
label_patterns:
  - '^[A-Z]\d+[A-Za-z]?$'         # arm labels A1, G15, D1
  - '^[A-Z]{1,3}-\d+[A-Za-z]?$'   # control and check labels PC-1, NC-2, CONF-1
  - '^[A-Z]\d*\*$'
  - '^(?:NC|GP|PK|TB|TC|EC|EV)-?\d+$'
  - '^[IVX]+$'
