# Vale configuration for tools/prose_check.py.
# Packages (proselint, write-good, Microsoft) are fetched with:
#   tools/bin/vale/vale.exe --config=tools/prose_rules/vale/.vale.ini sync
StylesPath = styles
MinAlertLevel = suggestion
Packages = proselint, write-good, Microsoft

[*.txt]
BasedOnStyles = proselint, write-good, Microsoft

# --- write-good: keep wordiness, weasel words, cliches, repeated words, "there is", "so".
# Passive voice is normal in Methods; E-Prime (no "to be") is not a journal requirement.
write-good.Passive = NO
write-good.E-Prime = NO

# --- proselint: drop rules about content that scientific prose does not contain, or that duplicate
# the journal rules / LanguageTool.
proselint.Annotations = NO
proselint.Cursing = NO
proselint.LGBTOffensive = NO
proselint.LGBTTerms = NO
proselint.GenderBias = NO
proselint.GroupTerms = NO
proselint.AnimalLabels = NO
proselint.DenizenLabels = NO
proselint.Currency = NO
proselint.DateCase = NO
proselint.DateMidnight = NO
proselint.DateRedundancy = NO
proselint.DateSpacing = NO
proselint.Diacritical = NO

# --- Microsoft: it is a documentation style guide; keep only the general-prose rules.
Microsoft.Accessibility = NO
Microsoft.Acronyms = NO
Microsoft.AMPM = NO
Microsoft.Auto = NO
Microsoft.Contractions = NO   # Microsoft style asks FOR contractions; journal prose avoids them (jes rule `contraction`)
Microsoft.BiasFree = NO
Microsoft.DateFormat = NO
Microsoft.DateNumbers = NO
Microsoft.DateOrder = NO
Microsoft.Foreign = NO
Microsoft.FirstPerson = NO
Microsoft.Gender = NO
Microsoft.GenderBias = NO
Microsoft.GeneralURL = NO
Microsoft.HeadingAcronyms = NO
Microsoft.HeadingColons = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Headings = NO
Microsoft.Hyphens = NO
Microsoft.Jargon = NO
Microsoft.Militaristic = NO
Microsoft.Negative = NO
Microsoft.Ordinal = NO
Microsoft.OxfordComma = NO
Microsoft.Passive = NO
Microsoft.Percentages = NO
Microsoft.QuestionMarks = NO
Microsoft.Quotes = NO
Microsoft.RangeTime = NO
Microsoft.Semicolon = NO
Microsoft.SentenceLength = NO
Microsoft.Terms = NO
Microsoft.UIVerbs = NO
Microsoft.Units = NO
Microsoft.URLFormat = NO
Microsoft.Vocab = NO
Microsoft.We = NO
